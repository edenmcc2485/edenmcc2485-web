<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Colorado River Basin</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'colorado_river_basin.json',
      center: [-110.95, 37.03],
      zoom: 4.7
    });
    map.addControl(new maplibregl.NavigationControl());

    // Popup when a station (blue dot) is clicked
    map.on('click', 'monitering locations', (e) => {
      const feature = e.features[0];
      const p = feature.properties;

      new maplibregl.Popup()
        .setLngLat(feature.geometry.coordinates.slice())
        .setHTML(`
          <strong>${p.name}</strong><br>
          Mean flow: ${Number(p.mean_cfs).toLocaleString()} cfs<br>
          <small>${p.period}</small>
        `)
        .addTo(map);
    });

    // Pointer cursor over the dots
    map.on('mouseenter', 'monitering locations', () => {
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'monitering locations', () => {
      map.getCanvas().style.cursor = '';
    });
  </script>
</body>
</html>
